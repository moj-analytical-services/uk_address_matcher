name: Release candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag of the existing draft release
        required: true
        type: string

permissions: {}

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  proposal:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/build/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.proposal.outputs.target_sha }}
    steps:
      - name: Require a draft targeting this commit
        id: proposal
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag: process.env.RELEASE_TAG
            });
            if (!release.draft) throw new Error('The release must still be a draft.');
            const { data: commit } = await github.rest.repos.getCommit({
              ...context.repo, ref: release.target_commitish
            });
            if (commit.sha !== context.sha) {
              throw new Error('Dispatch validation on the exact draft target commit.');
            }
            core.setOutput('target_sha', commit.sha);

  run-pytest:
    needs: proposal
    permissions:
      contents: read
    uses: ./.github/workflows/run_pytest.yml
    with:
      target_sha: ${{ needs.proposal.outputs.target_sha }}

  test-build-package:
    needs: proposal
    permissions:
      contents: read
    uses: ./.github/workflows/test-build-package.yaml
    with:
      target_sha: ${{ needs.proposal.outputs.target_sha }}

  test-labelling:
    needs: proposal
    permissions:
      contents: read
    uses: ./.github/workflows/labelling.yml
    with:
      target_sha: ${{ needs.proposal.outputs.target_sha }}

  security:
    needs: proposal
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml
    with:
      target_sha: ${{ needs.proposal.outputs.target_sha }}

  verified:
    name: Release candidate verified
    if: always()
    needs: [proposal, run-pytest, test-build-package, test-labelling, security]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VALIDATION_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Require all four gates, including cancelled and skipped checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const results = JSON.parse(process.env.VALIDATION_RESULTS);
            if (Object.values(results).some(job => job.result !== 'success')) {
              throw new Error('The draft check and all four validation gates must succeed.');
            }