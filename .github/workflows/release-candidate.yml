name: Release candidate

on:
  push:
    branches: [main, "build/**"]
    paths: [.github/release-candidate.json]

permissions: {}

jobs:
  proposal:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/build/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      target_sha: ${{ steps.proposal.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.3"
          enable-cache: false
      - name: Require a matching mutable draft and source SHA
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 --with packaging==25.0 python -I scripts/release.py proposal

  run-pytest:
    needs: proposal
    permissions:
      contents: read
    uses: ./.github/workflows/run_pytest.yml
    with:
      target_sha: ${{ needs.proposal.outputs.target_sha }}

  test-build-package:
    needs: proposal
    permissions:
      contents: read
    uses: ./.github/workflows/test-build-package.yaml
    with:
      target_sha: ${{ needs.proposal.outputs.target_sha }}

  test-labelling:
    needs: proposal
    permissions:
      contents: read
    uses: ./.github/workflows/labelling.yml
    with:
      target_sha: ${{ needs.proposal.outputs.target_sha }}

  security:
    needs: proposal
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml
    with:
      target_sha: ${{ needs.proposal.outputs.target_sha }}

  verified:
    name: Release candidate verified
    if: always()
    needs: [run-pytest, test-build-package, test-labelling, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      VALIDATION_RESULTS: ${{ toJSON(needs) }}
      DIST_ARTIFACT_ID: ${{ needs.test-build-package.outputs.dist-artifact-id }}
    steps:
      - name: Require all four gates, including cancelled and skipped checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const results = JSON.parse(process.env.VALIDATION_RESULTS);
            if (Object.values(results).some(job => job.result !== 'success')) {
              throw new Error('All four validation gates must succeed.');
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.3"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.test-build-package.outputs.dist-artifact-id }}
          merge-multiple: true
          path: dist
      - name: Bind the draft, tested commit and exact distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 --with packaging==25.0 python -I scripts/release.py candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-${{ github.run_attempt }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30