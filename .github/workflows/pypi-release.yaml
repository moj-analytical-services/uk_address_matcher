name: Publish release to PyPI

run-name: Publish ${{ github.event.release.tag_name || github.event.inputs.release_tag }} to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to deploy to PyPI
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-release-${{ github.event.release.tag_name || github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: release
    steps:
      - name: Find the successful package build for this commit
        id: package
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            let targetSha = context.sha;
            if (context.eventName === 'workflow_dispatch') {
              const releaseTag = context.payload.inputs?.release_tag?.trim();
              if (!releaseTag) {
                throw new Error('The release_tag workflow input is required for manual publishing.');
              }
              const { data: release } = await github.rest.repos.getReleaseByTag({
                ...context.repo,
                tag: releaseTag
              });
              if (release.draft) {
                throw new Error(`Release ${releaseTag} must be published before deploying to PyPI.`);
              }
              const { data: tagRef } = await github.rest.git.getRef({
                ...context.repo,
                ref: `tags/${releaseTag}`
              });
              let taggedObject = tagRef.object;
              if (taggedObject.type === 'tag') {
                const { data: annotatedTag } = await github.rest.git.getTag({
                  ...context.repo,
                  tag_sha: taggedObject.sha
                });
                taggedObject = annotatedTag.object;
              }
              if (taggedObject.type !== 'commit') {
                throw new Error(`Release tag ${releaseTag} does not resolve to a commit.`);
              }
              targetSha = taggedObject.sha;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'test-build-package.yaml',
              event: 'push',
              head_sha: targetSha,
              per_page: 1
            });
            const run = data.workflow_runs[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success' ||
                run.head_sha !== targetSha ||
                run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                !(run.head_branch === 'main' || run.head_branch.startsWith('build/'))) {
              throw new Error(`A successful package build for ${targetSha} is required before publishing to PyPI.`);
            }
            core.setOutput('run_id', run.id);
      - name: Download the CI-built package without rebuilding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.package.outputs.run_id }}
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.3"
          enable-cache: false
      - name: Publish to PyPI using Trusted Publishing
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
