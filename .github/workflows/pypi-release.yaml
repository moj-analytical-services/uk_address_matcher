name: Publish release to PyPI

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.release.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: release
    steps:
      - name: Require successful validation of the published commit
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'release-candidate.yml',
              event: 'workflow_dispatch',
              head_sha: context.sha,
              per_page: 1
            });
            const run = data.workflow_runs[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success' ||
              run.head_sha !== context.sha ||
                run.head_repository.full_name !== context.payload.repository.full_name ||
                !(run.head_branch === 'main' || run.head_branch.startsWith('build/'))) {
              throw new Error('The latest candidate run for this commit must succeed before publishing to PyPI.');
            }
            core.setOutput('run_id', run.id);
            core.setOutput('artifact_name', `dist-${run.run_attempt}`);
      - name: Download the tested package without rebuilding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: dist
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.3"
          enable-cache: false
      - name: Publish to PyPI using Trusted Publishing
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
