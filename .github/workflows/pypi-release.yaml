name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-pytest:
    name: Run pytest matrix checks
    permissions:
      contents: read
    uses: ./.github/workflows/run_pytest.yml

  test-build-package:
    name: Test build package
    permissions:
      contents: read
    uses: ./.github/workflows/test-build-package.yaml

  test-labelling:
    name: Test labelling app
    permissions:
      contents: read
    uses: ./.github/workflows/labelling.yml

  security:
    name: Run security checks
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml

  publish:
    needs: [run-pytest, test-build-package, test-labelling, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # The `release` environment requires a 60-minute wait and approval
    # from moj-analytical-services/data_linking in GitHub settings.
    environment:
      name: release

    steps:
      - name: Ensure tag commit is latest on main
        id: main_guard
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const main = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: 'main',
            });

            const mainSha = main.data.commit.sha;
            const tagSha = context.sha;

            core.info(`main HEAD: ${mainSha}`);
            core.info(`tag commit: ${tagSha}`);

            if (mainSha !== tagSha) {
              core.setFailed(
                `Tag commit (${tagSha}) is not the latest commit on main (${mainSha}). ` +
                'Create the release tag from current main HEAD to ensure the publish uses the newest source.'
              );
              return;
            }

            core.setOutput('release_sha', tagSha);

      - name: Download verified distributions from this release run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.3"
          enable-cache: false

      - name: Publish to PyPI using Trusted Publishing
        run: uv publish --trusted-publishing always dist/*