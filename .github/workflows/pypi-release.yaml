name: Publish release to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  run-pytest:
    name: Run pytest matrix checks
    permissions:
      contents: read
    uses: ./.github/workflows/run_pytest.yml

  test-build-package:
    name: Test build package
    permissions:
      contents: read
    uses: ./.github/workflows/test-build-package.yaml

  test-labelling:
    name: Test labelling app
    permissions:
      contents: read
    uses: ./.github/workflows/labelling.yml

  security:
    name: Run security checks
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml

  publish:
    needs: [run-pytest, test-build-package, test-labelling, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    # The `release` environment requires a 60-minute wait and approval
    # from moj-analytical-services/data_linking in GitHub settings.
    environment:
      name: release

    steps:
      - name: Download verified distributions from this release run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.3"
          enable-cache: false

      - name: Publish to PyPI using Trusted Publishing
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*