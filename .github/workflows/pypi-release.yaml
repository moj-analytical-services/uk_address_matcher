name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Ensure tag commit is latest on main
        id: main_guard
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const main = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: 'main',
            });

            const mainSha = main.data.commit.sha;
            const tagSha = context.sha;

            core.info(`main HEAD: ${mainSha}`);
            core.info(`tag commit: ${tagSha}`);

            if (mainSha !== tagSha) {
              core.setFailed(
                `Tag commit (${tagSha}) is not the latest commit on main (${mainSha}). ` +
                'Create the release tag from current main HEAD to ensure the publish uses the newest source.'
              );
              return;
            }

            core.setOutput('release_sha', tagSha);

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build sdist + wheel
        run: uv run --with build python -m build

      - name: Validate built package metadata
        run: uv run --with twine python -m twine check dist/*

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish dist/*
