name: Publish draft release to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag, such as v2.0.0.dev2
        required: true
        type: string
      validation_run_id:
        description: Successful Release candidate workflow run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-draft-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}

jobs:
  inspect:
    name: Verify the selected candidate, without rebuilding
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/build/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      manifest_id: ${{ steps.verified.outputs.manifest_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.3"
          enable-cache: false
      - name: Verify draft, validation attempt and immutable artefacts
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 --with packaging==25.0 python -I scripts/release.py publish-check

  publish:
    needs: inspect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    environment:
      name: release
    env:
      MANIFEST_ID: ${{ needs.inspect.outputs.manifest_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.3"
          enable-cache: false
      - name: Recheck the approved draft and original files after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 --with packaging==25.0 python -I scripts/release.py publish-check
      - name: Publish to PyPI using Trusted Publishing
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

  finalise:
    needs: [inspect, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      MANIFEST_ID: ${{ needs.inspect.outputs.manifest_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.3"
          enable-cache: false
      - name: Attach original files and publish the immutable GitHub release last
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 --with packaging==25.0 python -I scripts/release.py finalise