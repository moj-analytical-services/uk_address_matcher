name: Run address matcher with external labels

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'uk_address_matcher/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-address-matcher:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.10'

    - name: Setup uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        version: "0.11.3"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install the project
      run: uv sync --all-extras --dev

    - name: Clone address_matching_labels repo
      env:
        LABELS_PAT: ${{ secrets.LABELS_PAT }}
      run: |
        git clone https://RobinL:${LABELS_PAT}@github.com/RobinL/address_matching_labels.git


    - name: Run labels accuracy script and capture output
      run: uv run .github/workflows/run_labels_accuracy_test.py
      continue-on-error: true

    - name: Publish heavy-check summary
      if: always()
      run: |
        if [ -s github-comment.md ]; then
          cat github-comment.md >> "$GITHUB_STEP_SUMMARY"
        else
          {
            echo "## ❌ Address matcher heavy check failed"
            echo ""
            echo "No output file (github-comment.md) was produced."
          } >> "$GITHUB_STEP_SUMMARY"
        fi