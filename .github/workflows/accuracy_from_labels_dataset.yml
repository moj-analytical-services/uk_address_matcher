name: Run address matcher with external labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'uk_address_matcher/**'
      - '.github/workflows/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-address-matcher:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: private-labels
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'

    - name: Setup uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.11.3"
        enable-cache: false

    - name: Install the project
      run: uv sync --all-extras --dev --locked

    - name: Clone address_matching_labels repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: RobinL/address_matching_labels
        token: ${{ secrets.LABELS_PAT }}
        path: address_matching_labels
        persist-credentials: false

    - name: Run labels accuracy script and capture output
      run: uv run .github/workflows/run_labels_accuracy_test.py
      continue-on-error: true

    - name: Publish heavy-check summary
      if: always()
      run: |
        if [ -s github-comment.md ]; then
          cat github-comment.md >> "$GITHUB_STEP_SUMMARY"
        else
          {
            echo "## ❌ Address matcher heavy check failed"
            echo ""
            echo "No output file (github-comment.md) was produced."
          } >> "$GITHUB_STEP_SUMMARY"
        fi