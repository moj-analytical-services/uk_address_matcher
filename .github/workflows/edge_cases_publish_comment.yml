name: Publish edge cases comment

on:
  workflow_run:
    workflows: [Edge cases comment]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: edge-cases-comment-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions: {actions: read, contents: read, pull-requests: write}
    steps:
      - name: Validate run, artefact and current PR
        id: validate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            if (run.repository.full_name !== `${owner}/${repo}` || run.pull_requests.length !== 1) {
              core.info('No uniquely associated PR; the result remains in the test summary.');
              return;
            }
            const number = run.pull_requests[0].number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open' || pr.head.sha !== run.head_sha) {
              core.info('Ignoring results for an outdated or closed PR.');
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: run.id,
            });
            const artefact = data.artifacts.find(item => item.name === 'edge-cases-comment');
            if (!artefact || artefact.expired || artefact.size_in_bytes > 100_000) {
              core.setFailed('Missing, expired or oversized comment artefact.');
              return;
            }
            core.setOutput('number', String(number));
            core.setOutput('artifact_id', String(artefact.id));
      - name: Download comment data only
        if: steps.validate.outputs.number != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.validate.outputs.artifact_id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/edge-cases-comment
          merge-multiple: true
      - name: Publish validated comment data without executing it
        if: steps.validate.outputs.number != ''
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PR_NUMBER: ${{ steps.validate.outputs.number }}
          COMMENT_PATH: ${{ runner.temp }}/edge-cases-comment/github-comment.md
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.state !== 'open' || pr.head.sha !== context.payload.workflow_run.head_sha) return;
            const file = process.env.COMMENT_PATH;
            if (!fs.lstatSync(file).isFile() || fs.statSync(file).size > 60_000) {
              core.setFailed('Comment must be a regular Markdown file under 60 KB.');
              return;
            }
            const marker = '<!-- ukam-edge-cases -->';
            const body = `${marker}\n${fs.readFileSync(file, 'utf8')}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            const existing = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' && comment.body.startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }