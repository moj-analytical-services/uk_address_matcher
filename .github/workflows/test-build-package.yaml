name: Test build package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "uk_address_matcher/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: test-build-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build sdist + wheel
        run: uv run --with build python -m build

      - name: Check package metadata
        run: uv run --with twine python -m twine check dist/*

      - name: Smoke test wheel installs and imports
        run: |
          uv venv .venv-wheeltest -p 3.10 --clear
          uv pip install --python .venv-wheeltest/bin/python dist/*.whl
          .venv-wheeltest/bin/python -c "import uk_address_matcher; print('Imported uk_address_matcher OK')"