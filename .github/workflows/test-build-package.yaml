name: Test build package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "uk_address_matcher/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: test-build-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Build labelling app assets
        run: npm ci && npm run build

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build sdist + wheel
        run: uv run --with build python -m build

      - name: Check package metadata
        run: uv run --with twine python -m twine check dist/*

      - name: Smoke test wheel assets and CLI
        run: |
          uv venv .venv-wheeltest -p 3.10 --clear
          uv pip install --python .venv-wheeltest/bin/python dist/*.whl
          .venv-wheeltest/bin/python -c "from uk_address_matcher.labelling.server import _static_root; assert (_static_root() / 'index.html').is_file()"
          .venv-wheeltest/bin/ukam-apply-labelling-updates --help