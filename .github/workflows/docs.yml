name: Deploy MkDocs (GitHub Pages)

on:
    pull_request:
        branches: [main]
        paths:
            - mkdocs.yml
            - docs/**
            - frontend/labelling/**
            - uk_address_matcher/labelling/app/**
    push:
        branches: [main]
        paths:
            - mkdocs.yml
            - docs/**
            - frontend/labelling/**
            - uk_address_matcher/labelling/app/**

permissions: {}

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        permissions: {contents: read, pages: read}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "22"
                  package-manager-cache: false

            - name: Install frontend dependencies
              working-directory: frontend/labelling
              run: npm ci

            - name: Build labelling app
              working-directory: frontend/labelling
              run: npm run build

            - name: Install uv
              uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  version: "0.11.3"
                  enable-cache: false

            - name: Set up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.12"

            - name: Install docs dependencies
              run: uv sync --group docs --locked

            - name: Build site
              run: uv run mkdocs build --strict

            - name: Upload Pages artefact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: site

    deploy:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        needs: build
        permissions: {pages: write, id-token: write}
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
