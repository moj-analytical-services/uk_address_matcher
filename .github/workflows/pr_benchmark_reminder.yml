name: PR benchmark reminder

on:
  pull_request:
    branches: [main]
    paths:
      - 'uk_address_matcher/**'
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-reminder:
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Write benchmark reminder to job summary
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          printf '%s\n' \
            '## 🚨 Benchmark Check Required Before Merge' \
            '' \
            'Before merging this PR, make sure that you run the following check to test for performance regression:' \
            '' \
            '```bash' \
            "bash ./dev_scripts/shell/compare_commits.sh \\" \
            "  -b ${PR_BASE_REF} \\" \
            "  -c ${PR_HEAD_SHA} \\" \
            '  -d rhondda,aberdeenshire,hackney,mid_sussex' \
            '```' \
            '' \
            'This summary is regenerated whenever a new commit triggers this workflow.' \
            '' \
            '> [!NOTE]' \
            '> If you have changed the cleaning, you will need to rerun cleaning prep in order to test these changes successfully.' \
            >> "$GITHUB_STEP_SUMMARY"