name: Edge cases comment

on:
  pull_request:
    branches: [main]
    paths:
      - "uk_address_matcher/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-address-matcher:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.10'

    - name: Setup uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        version: "0.11.3"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install the project
      run: uv sync --all-extras --dev --locked

    - name: Run address matcher test
      id: run-test
      run: uv run .github/workflows/run_address_test.py
      continue-on-error: true

    - name: Ensure comment content exists
      if: always()
      run: |
        if [ ! -s github-comment.md ]; then
          printf '%s\n' \
            '## ❌ Address Matcher Test Failed' \
            '' \
            'No results file was produced by the test step.' \
            'Please check the workflow logs for details.' \
            > github-comment.md
        fi

    - name: Debug comment file
      if: always()
      run: |
        echo "Comment file info:"
        ls -l github-comment.md
        echo "Character count:"
        wc -c github-comment.md
        echo "Preview (first 40 lines):"
        sed -n '1,40p' github-comment.md

    - name: Publish job summary
      if: always()
      run: cat github-comment.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload comment data
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: edge-cases-comment
        path: github-comment.md
        retention-days: 3