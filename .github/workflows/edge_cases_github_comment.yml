name: Edge cases comment

on:
  pull_request:
    branches: [main]
    paths:
      - "uk_address_matcher/**"
      - "tests/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-address-matcher:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'

    - name: Setup uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.11.3"
        enable-cache: false

    - name: Install the project
      run: uv sync --all-extras --dev --locked

    - name: Run address matcher test
      id: run-test
      run: uv run .github/workflows/run_address_test.py
      continue-on-error: true

    - name: Ensure comment content exists
      if: always()
      run: |
        if [ ! -s github-comment.md ]; then
          printf '%s\n' \
            '## ❌ Address Matcher Test Failed' \
            '' \
            'No results file was produced by the test step.' \
            'Please check the workflow logs for details.' \
            > github-comment.md
        fi

    - name: Debug comment file
      if: always()
      run: |
        echo "Comment file info:"
        ls -l github-comment.md
        echo "Character count:"
        wc -c github-comment.md
        echo "Preview (first 40 lines):"
        sed -n '1,40p' github-comment.md

    - name: Publish job summary
      if: always()
      run: cat github-comment.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload comment data
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: edge-cases-comment
        path: github-comment.md
        retention-days: 3