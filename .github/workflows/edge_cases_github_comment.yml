name: Edge cases comment

on:
  pull_request:
    branches: [main]
    paths:
      - "uk_address_matcher/**"
      - "tests/**"

permissions:
  contents: read
  pull-requests: write
  issues: write # PR comments are issue comments under the hood; this avoids permission surprises

jobs:
  test-address-matcher:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install the project
      run: uv sync --all-extras --dev

    - name: Run address matcher test
      id: run-test
      run: uv run .github/workflows/run_address_test.py
      continue-on-error: true

    - name: Ensure comment content exists
      if: always()
      run: |
        if [ ! -s github-comment.md ]; then
          cat > github-comment.md << 'EOF'
          ## ❌ Address Matcher Test Failed

          No results file was produced by the test step.
          Please check the workflow logs for details.
          EOF
        fi

    - name: Upsert PR comment (sticky)
      if: always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const marker = '<!-- address-matcher-edge-cases -->';

          let commentContent = '';
          try {
            commentContent = fs.readFileSync('github-comment.md', 'utf8').trim();
          } catch (error) {
            core.warning(`Failed to read github-comment.md: ${error.message}`);
          }

          if (!commentContent) {
            commentContent = [
              '## ❌ Address Matcher Test Failed',
              '',
              'No results content was produced.',
              'Please check the workflow logs for details.'
            ].join('\n');
          }

          const body = `${marker}\n${commentContent}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
            per_page: 100,
          });

          const existing = comments.find(
            (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker)
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
            core.info(`Updated existing sticky comment (${existing.id}).`);
          } else {
            const created = await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
            core.info(`Created sticky comment (${created.data.id}).`);
          }