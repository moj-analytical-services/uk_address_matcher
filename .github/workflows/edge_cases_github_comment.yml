name: Edge cases comment

on:
  pull_request:
    branches: [main]
    paths:
      - "uk_address_matcher/**"

permissions:
  contents: read
  pull-requests: write
  issues: write # PR comments are issue comments under the hood; this avoids permission surprises

jobs:
  test-address-matcher:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Setup uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install the project
      run: uv sync --all-extras --dev

    - name: Run address matcher test
      id: run-test
      run: uv run .github/workflows/run_address_test.py
      continue-on-error: true

    - name: Comment on PR (sticky)
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: address-matcher-edge-cases
        path: github-comment.md
        hide_and_recreate: true
        hide_classify: OUTDATED
        skip_unchanged: true