name: Run pytest

on:
  workflow_call:
  pull_request:
    paths:
      - "uk_address_matcher/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "frontend/labelling/**"
  push:
    branches: [main]
    paths:
      - "uk_address_matcher/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "frontend/labelling/**"

permissions: {}

concurrency:
  group: run-pytest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.3"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --all-extras --dev --group model-training --locked

      - name: Install project in editable mode
        run: uv pip install -e .

      - name: Run pytest
        run: uv run pytest tests/ --ignore=tests/labelling -vv