name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security and workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.11.3"
          enable-cache: false
      - name: Install security tools only
        run: uv sync --locked --only-group security --no-install-project
      - name: Scan tracked files, Python dependencies and workflows
        env:
          SKIP: bandit
        run: uv run --no-sync pre-commit run --all-files
      - name: Ensure security controls were not modified by scanners
        if: always()
        run: git diff --exit-code -- security .pre-commit-config.yaml pyproject.toml uv.lock

  javascript-audit:
    name: JavaScript dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Audit locked dependencies without installing or executing packages
        run: npm audit --package-lock-only --ignore-scripts --audit-level=high