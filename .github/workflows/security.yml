name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security and workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.3"
          enable-cache: false
      - name: Install security tools only
        run: uv sync --locked --only-group security --no-install-project
      - name: Scan tracked files, Python dependencies and workflows
        env:
          SKIP: bandit
        run: uv run --no-sync pre-commit run --all-files --config security/pre-commit-config.yaml
      - name: Ensure security controls were not modified by scanners
        if: always()
        run: git diff --exit-code -- security pyproject.toml uv.lock

  javascript-audit:
    name: JavaScript dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Audit locked dependencies without installing or executing packages
        working-directory: frontend/labelling
        run: npm audit --package-lock-only --ignore-scripts --audit-level=high