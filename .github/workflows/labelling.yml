name: Test labelling app

on:
  pull_request:
    paths:
      - "uk_address_matcher/labelling/**"
      - "tests/labelling/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/labelling.yml"
  push:
    branches: [main]
    paths:
      - "uk_address_matcher/labelling/**"
      - "tests/labelling/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/labelling.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-labelling:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Build labelling app assets
        run: npm ci && npm run build

      - name: Check labelling app assets are current
        run: git diff --exit-code -- uk_address_matcher/labelling/app/static

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.11.3"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run labelling tests
        run: RUN_LABELLING_BROWSER_TESTS=1 uv run pytest tests/labelling -q